<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#06020f}
svg{display:block}
</style></head><body>
<svg id="pfp" width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#3b0d63"/>
      <stop offset=".6" stop-color="#16052e"/>
      <stop offset="1" stop-color="#06020f"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090320"/>
      <stop offset="1" stop-color="#4a0f6e"/>
    </linearGradient>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a137a"/>
      <stop offset=".55" stop-color="#ff3d8b"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff27a"/>
      <stop offset="1" stop-color="#ff5a7a"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd1f0"/>
      <stop offset=".5" stop-color="#ff5fb8"/>
      <stop offset="1" stop-color="#b0218a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset=".5" stop-color="#f6f9ff"/>
      <stop offset="1" stop-color="#ff2e9a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset=".18" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".82" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00c8ff"/>
      <stop offset="1" stop-color="#2a0a6a"/>
    </linearGradient>

    <path id="hg" d="M335 175 H745 C745 345 600 470 556 540 C600 610 745 735 745 905 H335 C335 735 480 610 524 540 C480 470 335 345 335 175Z"/>
    <clipPath id="hgTop"><use href="#hg"/><rect x="0" y="0" width="1080" height="541" fill="#000"/></clipPath>
    <clipPath id="top"><path d="M335 175 H745 C745 345 600 470 556 540 H524 C480 470 335 345 335 175Z"/></clipPath>
    <clipPath id="bot"><path d="M524 540 H556 C600 610 745 735 745 905 H335 C335 735 480 610 524 540Z"/></clipPath>

    <pattern id="win" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect width="14" height="18" fill="#12062a"/>
      <rect x="3" y="4" width="5" height="7" fill="#ffd36b" opacity=".85"/>
    </pattern>
    <pattern id="win2" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect width="14" height="18" fill="#12062a"/>
      <rect x="3" y="4" width="5" height="7" fill="#00e5ff" opacity=".8"/>
    </pattern>
    <pattern id="win3" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect width="14" height="18" fill="#12062a"/>
      <rect x="3" y="4" width="5" height="7" fill="#ff5fb8" opacity=".8"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>

    <path id="arcTop" d="M150 540 A390 390 0 0 1 930 540"/>
    <path id="arcBot" d="M120 540 A420 420 0 0 0 960 540"/>
  </defs>

  <!-- background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- light rays -->
  <g opacity=".18" fill="#ff5fb8">
    <g id="rays"></g>
  </g>
  <!-- outer neon ring -->
  <circle cx="540" cy="540" r="515" fill="none" stroke="url(#gold)" stroke-width="10" filter="url(#glow)" opacity=".9"/>


  <g transform="translate(540 490) scale(.8) translate(-540 -500)">
  <!-- hourglass glow -->
  <use href="#hg" fill="#ff2e9a" opacity=".45" filter="url(#soft)"/>

  <!-- TOP BULB: Vice City at night, sinking into sand -->
  <g clip-path="url(#top)">
    <rect x="300" y="160" width="480" height="390" fill="url(#night)"/>
    <g fill="#fff"><circle cx="420" cy="215" r="2.4"/><circle cx="610" cy="205" r="2"/><circle cx="680" cy="240" r="2.4"/><circle cx="500" cy="250" r="1.6"/></g>
    <!-- moon -->
    <circle cx="660" cy="232" r="22" fill="#ffe6f6"/>
    <circle cx="670" cy="226" r="20" fill="#120530"/>
    <!-- skyline -->
    <rect x="378" y="300" width="44" height="120" fill="url(#win)"/>
    <rect x="426" y="262" width="36" height="160" fill="url(#win3)"/>
    <polygon points="426,262 444,232 462,262" fill="#12062a"/>
    <rect x="466" y="245" width="48" height="180" fill="url(#win2)"/>
    <rect x="488" y="215" width="4" height="30" fill="#ff2e9a"/>
    <rect x="518" y="282" width="40" height="140" fill="url(#win)"/>
    <rect x="562" y="236" width="44" height="190" fill="url(#win3)"/>
    <rect x="610" y="292" width="38" height="130" fill="url(#win2)"/>
    <rect x="652" y="320" width="40" height="100" fill="url(#win)"/>
    <!-- neon rooftop strips -->
    <g stroke-width="4" filter="url(#glow)">
      <line x1="466" y1="245" x2="514" y2="245" stroke="#00e5ff"/>
      <line x1="562" y1="236" x2="606" y2="236" stroke="#ff2e9a"/>
    </g>
    <!-- sand swallowing the city, funnel dip in middle -->
    <path d="M300 400 C420 392 480 400 540 470 C600 400 660 392 780 400 V560 H300Z" fill="url(#sand)"/>
    <path d="M300 400 C420 392 480 400 540 470 C600 400 660 392 780 400" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
  </g>

  <!-- BOTTOM BULB: beach at sunset built from fallen sand -->
  <g clip-path="url(#bot)">
    <rect x="300" y="530" width="480" height="390" fill="url(#dusk)"/>
    <circle cx="540" cy="760" r="92" fill="url(#sun)"/>
    <g fill="#ff3d8b"><rect x="440" y="770" width="200" height="7"/><rect x="440" y="790" width="200" height="10"/></g>
    <rect x="300" y="805" width="480" height="120" fill="url(#sea)"/>
    <g stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
      <line x1="470" y1="822" x2="520" y2="822"/><line x1="560" y1="832" x2="620" y2="832"/><line x1="420" y1="842" x2="460" y2="842"/>
    </g>
    <!-- sand pile / island -->
    <path d="M300 905 C380 880 450 830 540 812 C630 830 700 880 780 905Z" fill="url(#sand)"/>
    <!-- palms on the island -->
    <g fill="#14052a">
      <path d="M470 875 C472 820 486 770 506 735 L512 738 C494 775 484 822 484 876Z"/>
      <path d="M508 737 C480 712 446 716 422 734 C452 724 480 726 506 744Z"/>
      <path d="M508 737 C496 704 466 690 440 694 C470 702 492 718 506 742Z"/>
      <path d="M509 737 C524 708 552 698 578 704 C552 710 530 722 512 744Z"/>
      <path d="M509 738 C538 728 566 738 580 760 C556 746 532 744 512 746Z"/>
      <path d="M612 870 C608 830 598 795 580 770 L575 773 C592 798 600 832 600 871Z"/>
      <path d="M578 772 C598 752 624 754 642 768 C620 762 600 764 580 778Z"/>
      <path d="M578 772 C572 750 552 740 534 744 C554 750 568 760 576 778Z"/>
      <path d="M579 772 C590 752 612 746 628 752 C608 756 594 764 582 778Z"/>
    </g>
  </g>

  <!-- falling sand stream: glowing grains -->
  <g filter="url(#glow)">
    <rect x="537" y="470" width="6" height="345" fill="#ffd1f0" opacity=".9"/>
  </g>
  <g fill="#fff" id="grains"></g>

  <!-- glass -->
  <use href="#hg" fill="url(#glass)"/>
  <use href="#hg" fill="none" stroke="#ffffff" stroke-opacity=".85" stroke-width="5"/>
  <path d="M362 200 C364 320 440 410 495 470" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="7" stroke-linecap="round"/>
  <path d="M362 880 C366 790 420 700 470 650" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>

  <!-- frame: neon posts + caps -->
  <g filter="url(#glow)">
    <rect x="296" y="160" width="14" height="760" rx="7" fill="#00e5ff"/>
    <rect x="770" y="160" width="14" height="760" rx="7" fill="#ff2e9a"/>
  </g>
  <rect x="270" y="128" width="540" height="52" rx="16" fill="#14052a" stroke="url(#gold)" stroke-width="6" filter="url(#glow)"/>
  <rect x="270" y="900" width="540" height="52" rx="16" fill="#14052a" stroke="url(#gold)" stroke-width="6" filter="url(#glow)"/>

  </g>
  <!-- VICE on bottom cap -->
  <g font-family="Inter Display, Inter, sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="540" y="975" font-size="104" letter-spacing="16" fill="none" stroke="#ff2e9a" stroke-width="8" filter="url(#glow)">VICE</text>
    <text x="540" y="975" font-size="104" letter-spacing="16" fill="#ffd6ec">VICE</text>
  </g>

  <!-- tilted neon "60" sticker, motel-sign style -->
  <g transform="translate(770 290) rotate(14) scale(.95)">
    <rect x="-140" y="-92" width="280" height="184" rx="34" fill="#0d0420" stroke="#00e5ff" stroke-width="8" filter="url(#glow)"/>
    <rect x="-122" y="-74" width="244" height="148" rx="22" fill="none" stroke="#ff2e9a" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <g font-family="Inter Display, Inter, sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
      <text x="-6" y="52" font-size="150" letter-spacing="-8" fill="none" stroke="#ff2e9a" stroke-width="10" filter="url(#glow)">60</text>
      <text x="-6" y="52" font-size="150" letter-spacing="-8" fill="#fff4fb">60</text>
      <text x="104" y="52" font-size="40" fill="#00e5ff">s</text>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#fff" filter="url(#glow)" id="sparks"></g>
</svg>
<script>
  const NS='http://www.w3.org/2000/svg';
  // light rays
  const rays=document.getElementById('rays');
  for(let i=0;i<18;i++){const a=i*20*Math.PI/180, b=a+0.07;
    const p=document.createElementNS(NS,'polygon');
    p.setAttribute('points',`540,540 ${540+900*Math.cos(a)},${540+900*Math.sin(a)} ${540+900*Math.cos(b)},${540+900*Math.sin(b)}`);
    rays.appendChild(p);}
  // falling grains
  const gr=document.getElementById('grains');
  for(let i=0;i<26;i++){const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',540+(Math.sin(i*7.3)*9)); c.setAttribute('cy',480+i*13);
    c.setAttribute('r',(i%3?1.8:3)); c.setAttribute('opacity',.9);
    gr.appendChild(c);}
  // 4-point sparkles
  const sp=document.getElementById('sparks');
  [[180,330,22],[905,620,18],[230,760,16],[860,840,12],[200,520,10],[900,470,10]].forEach(([x,y,s])=>{
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M${x} ${y-s} Q${x} ${y} ${x+s} ${y} Q${x} ${y} ${x} ${y+s} Q${x} ${y} ${x-s} ${y} Q${x} ${y} ${x} ${y-s}Z`);
    sp.appendChild(p);});
</script>
</body></html>
